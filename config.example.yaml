# Second Brain — Configuration
#
# Copy this file to config.yaml and point vault_path at your own vault.
# config.yaml is gitignored, so your real settings stay local.

vault_path: "C:/path/to/your/vault"

# Where you drop raw transcript files
input_folder: "Transcripts"

# Where processed notes are written (auto-created if absent)
output_folder: "Meetings"

# Processed-file tracking log — do not edit manually
tracking_file: ".second-brain/processed.jsonl"

# File extensions to scan for transcripts
supported_extensions:
  - ".txt"
  - ".md"

# Telegram capture pipeline
telegram:
  offset_file: ".second-brain/telegram_offset.json"

# Vault folders for captured content (auto-created on first run)
capture_folders:
  personal_practice: "Personal/Practice"
  project_idea: "Projects/Ideas"
  knowledge_framework: "Knowledge/Frameworks"
  knowledge_best_practice: "Knowledge/Best Practices"
  knowledge_reference: "Knowledge/References"
  knowledge_tool: "Knowledge/Tools"
  perspective: "Perspective"
  # Legacy keys kept for compatibility with older classifier outputs.
  captures: "Captures"
  ideas: "Ideas"
  knowledge: "Knowledge"
  inbox: "Inbox"

# Vault maintenance workflow
maintenance:
  scan_folders:
    - "Captures"
    - "Ideas"
    - "Personal"
    - "Projects"
    - "Knowledge"
    - "Perspective"
    - "Inbox"
    - "Meetings"
    - "Reviews"
    - "Growth"
    - "Maintenance"
    - "Profile"
  report_folder: "Maintenance/Reports"
  change_log_folder: "Maintenance/Change Log"
  run_log: ".second-brain/maintenance_runs.jsonl"
  backup_root: ".second-brain/backups"

# Model configuration
models:
  transcript_processing:
    provider: openai
    model: gpt-4o-mini

  capture_processing:
    provider: google
    model: gemini-2.5-flash-lite

  weekly_review:
    provider: google
    model: gemini-2.5-flash-lite

  growth_coach:
    provider: google
    model: gemini-2.5-flash-lite
