# Second Brain — Configuration
# ─────────────────────────────────────────────────────────────────────────────

vault_path: "C:/Users/user/vault"

# Where you drop raw transcript files
input_folder: "Transcripts"

# Where processed notes are written (auto-created if absent)
output_folder: "Meetings"

# Processed-file tracking log — do not edit manually
tracking_file: ".second-brain/processed.jsonl"

# File extensions to scan for transcripts
supported_extensions:
  - ".txt"
  - ".md"
  - ".vtt"
  - ".srt"

# ─────────────────────────────────────────────────────────────────────────────
# Model configuration
# Each key is a workflow. Set the provider and model for each one independently.
#
# Supported providers:  anthropic, openai
#
# Anthropic models:
#   claude-haiku-4-5-20251001   — fast, cheapest Anthropic option
#   claude-sonnet-4-6           — best balance
#   claude-opus-4-6             — highest quality
#
# OpenAI models:
#   gpt-4o-mini                 — cheap, good for bulk transcript processing
#   gpt-4o                      — higher quality, more expensive
#   o3-mini                     — reasoning model, overkill for transcripts
# ─────────────────────────────────────────────────────────────────────────────
models:
  transcript_processing:
    provider: openai
    model: gpt-4o-mini

  # Uncomment and configure when you add insight generation later:
  # insight_generation:
  #   provider: anthropic
  #   model: claude-sonnet-4-6
